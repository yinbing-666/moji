[package]
name = "xiaohei-daily"
version = "0.2.0"
description = "AI 自动工作日报生成工具"
edition = "2021"
default-run = "xiaohei-daily"

[lib]
name = "xiaohei_daily_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# backup feature：启用 rusqlite 的 SQLite 在线备份 API（restore_backup_to_db 恢复到打开中的连接用），无额外依赖
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
screenshots = "0.8.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
printpdf = "0.7"
[target.'cfg(target_os = "windows")'.dependencies]
# windows crate：完整 COM 绑定，用于 UI Automation 文本采集（windows-sys 仅含常量，无 UIA 接口）
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Time",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging"
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_StationsAndDesktops",
  "Win32_Graphics_Dwm",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
