[package]
name = "xiaohei-daily"
version = "0.1.0"
description = "AI 自动工作日报生成工具"
authors = ["you"]
edition = "2021"

[lib]
name = "xiaohei_daily_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshots = "0.8.10"
base64 = "0.22"
