name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    name: Frontend (npm run build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Feature tests
        run: npm run test:features

      - name: Build
        run: npm run build

  backend:
    name: Backend (cargo check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 内置 ActivityWatch 二进制不进 git，从本仓库 Release 下载（build.rs 校验 resources 需要它存在）
      - name: Fetch AW binary
        shell: pwsh
        run: ./scripts/fetch-aw-server.ps1

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri
