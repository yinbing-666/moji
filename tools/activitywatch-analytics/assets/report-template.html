<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ActivityWatch Analytics</title>
  <style>
    :root {
      --bg:#070b12; --sidebar:#080d16; --card:#111722; --card2:#151d29; --line:#222c3b;
      --text:#f5f7fb; --muted:#8792a6; --purple:#7547f5; --purple2:#944cf5;
      --green:#34d399; --blue:#3b82f6; --orange:#f59e0b; --red:#f05d4f; --cyan:#36c5d0;
      --shadow:0 16px 45px rgba(0,0,0,.25);
    }
    body.light {
      --bg:#f4f6fb; --sidebar:#ffffff; --card:#ffffff; --card2:#f7f8fc; --line:#e4e8f0;
      --text:#172033; --muted:#667085; --shadow:0 12px 30px rgba(38,45,68,.09);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.45}
    button{font:inherit} .shell{min-height:100vh;display:grid;grid-template-columns:214px 1fr}
    .sidebar{position:fixed;inset:0 auto 0 0;width:214px;background:linear-gradient(180deg,var(--sidebar),color-mix(in srgb,var(--sidebar) 94%,#101a2b));border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:10}
    .brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}.logo{width:38px;height:38px;border:3px solid #8b5cf6;border-radius:50%;display:grid;place-items:center;color:#b69cff;font-weight:800;box-shadow:0 0 24px rgba(117,71,245,.25)}
    .brand strong{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:6px;margin-top:16px}.nav button{border:0;color:var(--muted);background:transparent;text-align:left;padding:11px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:11px}.nav button:hover{background:var(--card);color:var(--text)}.nav button.active{color:#fff;background:linear-gradient(110deg,#6845eb,#8b45f5);box-shadow:0 8px 25px rgba(117,71,245,.25)}.nav-icon{width:18px;text-align:center}
    .source-card{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.source-card h4{margin:0 0 8px;font-size:12px}.source-card p{margin:5px 0;color:var(--muted);font-size:11px}.source-ok{color:var(--green)!important}
    main{grid-column:2;padding:20px 18px 30px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 18px}.topbar h1{font-size:21px;margin:0}.date-badge{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 18px;font-size:12px;color:var(--text)}.actions{display:flex;gap:10px;align-items:center}.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}.status-badge{border:1px solid rgba(52,211,153,.25);background:rgba(52,211,153,.08);color:var(--green);padding:6px 10px;border-radius:99px;font-size:11px}
    .page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.overview-top{grid-template-columns:288px 1fr}.overview-middle{grid-template-columns:1fr 1.08fr}.overview-bottom{grid-template-columns:1fr 1fr 1.1fr}.card{background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--card) 93%,#1c2636));border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:18px;min-width:0}.card h2,.card h3{font-size:15px;margin:0 0 16px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.card-head h3{margin:0}.link-button{border:0;background:var(--card2);color:var(--muted);padding:7px 10px;border-radius:7px;font-size:10px;cursor:pointer}.link-button:hover{color:var(--text)}
    .score-wrap{display:grid;place-items:center;text-align:center}.score-ring{--score:0;width:142px;height:142px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--score)*1%),#2a3342 0);position:relative;margin:8px auto 13px;box-shadow:inset 0 0 25px rgba(0,0,0,.1)}.score-ring:after{content:"";position:absolute;width:116px;height:116px;border-radius:50%;background:var(--card)}.score-value{position:relative;z-index:1;font-size:42px;font-weight:750;letter-spacing:-2px;line-height:1}.score-value small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:8px}.score-label{font-weight:700}.score-note{font-size:11px;color:var(--muted);margin:8px 0 0}.calibration{display:inline-block;margin-top:10px;padding:4px 8px;border-radius:99px;background:rgba(117,71,245,.12);color:#a989ff;font-size:10px}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);min-height:182px;align-items:center}.metric{padding:4px 20px;border-left:1px solid var(--line)}.metric:first-child{border-left:0}.metric-label{color:var(--muted);font-size:11px}.metric-label i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.metric strong{display:block;font-size:28px;margin:9px 0 4px}.metric-sub{font-size:10px;color:var(--muted)}.delta{display:block;font-size:11px;margin-top:12px}.positive{color:var(--green)}.negative{color:var(--orange)}.neutral{color:var(--blue)}
    .donut-layout{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:center}.donut{width:184px;height:184px;border-radius:50%;position:relative;margin:auto;background:#273142}.donut:after{content:"";position:absolute;inset:37px;background:var(--card);border-radius:50%}.donut-center{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;font-size:21px;font-weight:700}.donut-center small{font-size:10px;color:var(--muted);font-weight:500}.legend{display:grid;gap:9px}.legend-row{display:grid;grid-template-columns:11px 1fr auto auto;gap:8px;align-items:center;font-size:11px}.legend-dot{width:9px;height:9px;border-radius:50%}.legend-row strong{font-size:11px}.legend-row em{font-style:normal;color:var(--muted);width:42px;text-align:right}
    .svg-wrap{overflow:auto}.svg-wrap svg{width:100%;height:auto;display:block;border-radius:12px}.rank-list{display:grid;gap:11px}.rank-row{display:grid;grid-template-columns:22px 30px 1fr 90px auto;gap:8px;align-items:center;font-size:11px}.rank{color:var(--muted);text-align:center}.app-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#5b7cff,#7447e9);display:grid;place-items:center;color:#fff;font-weight:700}.rank-bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}.rank-bar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--cyan))}.rank-time{font-weight:650;white-space:nowrap}
    .insight-list{display:grid;gap:10px}.insight{display:grid;grid-template-columns:42px 1fr;gap:11px;background:var(--card2);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:10px;padding:12px}.insight-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(52,211,153,.09);color:var(--green);font-size:18px}.insight.warning .insight-icon{background:rgba(245,158,11,.09);color:var(--orange)}.insight.info .insight-icon{background:rgba(59,130,246,.09);color:var(--blue)}.insight h4{font-size:12px;margin:0 0 4px}.insight p{font-size:10px;margin:0;color:var(--muted)}
    .today-advice{margin-top:14px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px}.today-advice .star{font-size:22px;color:#9c6cff}.today-advice strong{font-size:12px}.today-advice p{font-size:10px;color:var(--muted);margin:3px 0 0}.chevron{color:var(--muted)}
    .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:1/-1}.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.kpi span{display:block;color:var(--muted);font-size:10px}.kpi strong{font-size:24px;display:block;margin-top:7px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:500}.table td:last-child,.table th:last-child{text-align:right}.pill{display:inline-block;padding:3px 7px;border-radius:99px;font-size:9px;background:var(--card2);color:var(--muted)}.pill.ok{background:rgba(52,211,153,.09);color:var(--green)}.pill.warn{background:rgba(245,158,11,.09);color:var(--orange)}
    .heatmap{display:grid;grid-template-columns:repeat(24,1fr);gap:5px;align-items:end;height:130px}.heatbar{background:var(--purple);border-radius:5px 5px 2px 2px;min-height:3px;position:relative}.heatbar:hover:after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#02050a;color:#fff;padding:5px 7px;border-radius:5px;font-size:9px;white-space:nowrap;z-index:5}.section-note{font-size:10px;color:var(--muted);margin-top:10px}.empty{color:var(--muted);font-size:11px;padding:20px;text-align:center}.footer{color:var(--muted);text-align:center;font-size:10px;margin-top:22px}.privacy-note{border-left:3px solid var(--purple);padding:10px 12px;background:rgba(117,71,245,.07);font-size:10px;color:var(--muted);border-radius:4px}
    @media(max-width:1100px){.overview-top,.overview-middle,.overview-bottom,.detail-grid{grid-template-columns:1fr}.overview-bottom{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(3){border-left:0}.wide{grid-column:auto}}
    @media(max-width:760px){.shell{display:block}.sidebar{position:relative;width:auto;height:auto}.nav{grid-template-columns:repeat(3,1fr)}.source-card{display:none}main{grid-column:auto}.topbar{flex-wrap:wrap;gap:12px}.overview-bottom,.kpi-row{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.metric{border-left:0;border-top:1px solid var(--line);padding:14px 4px}.donut-layout{grid-template-columns:1fr}.rank-row{grid-template-columns:22px 30px 1fr auto}.rank-bar{display:none}}
    @media print{.sidebar,.actions{display:none}.shell{display:block}main{padding:0}.page{display:block!important;break-before:page}.page:first-of-type{break-before:auto}.card{box-shadow:none;break-inside:avoid}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">AW</div><div><strong>AI Analytics</strong><small>ActivityWatch</small></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="source-card" id="sourceCard"></div>
    </aside>
    <main>
      <header class="topbar"><h1 id="pageTitle">概览</h1><div class="date-badge" id="periodLabel"></div><div class="actions"><span class="status-badge" id="calibrationBadge"></span><button class="icon-btn" id="themeToggle" title="Theme">☼</button></div></header>

      <section class="page active" data-page="overview">
        <div class="grid overview-top">
          <article class="card"><h2 id="scoreTitle"></h2><div class="score-wrap"><div class="score-ring" id="scoreRing"><div class="score-value"><span id="pulse"></span><small>/100</small></div></div><div class="score-label" id="scoreLabel"></div><p class="score-note" id="scoreNote"></p><span class="calibration" id="scoreStatus"></span></div></article>
          <article class="card"><h2 id="timeOverviewTitle"></h2><div class="metrics" id="metrics"></div></article>
        </div>
        <div class="grid overview-middle" style="margin-top:14px">
          <article class="card"><div class="card-head"><h3 id="distributionTitle"></h3><button class="link-button" data-goto="time"></button></div><div class="donut-layout"><div class="donut" id="donut"><div class="donut-center"><span id="donutTotal"></span><small id="donutCaption"></small></div></div><div class="legend" id="categoryLegend"></div></div></article>
          <article class="card"><div class="card-head"><h3 id="trendTitle"></h3><button class="link-button" data-goto="trends">28D</button></div><div class="svg-wrap">{{TREND_SVG}}</div></article>
        </div>
        <div class="grid overview-bottom" style="margin-top:14px">
          <article class="card"><div class="card-head"><h3 id="appRankTitle"></h3><button class="link-button" data-goto="apps"></button></div><div class="rank-list" id="appRank"></div></article>
          <article class="card"><div class="card-head"><h3 id="siteRankTitle"></h3><button class="link-button" data-goto="websites"></button></div><div class="rank-list" id="siteRank"></div></article>
          <article class="card"><div class="card-head"><h3 id="insightTitle"></h3><button class="link-button" data-goto="ai"></button></div><div class="insight-list" id="insightList"></div></article>
        </div>
        <article class="card today-advice" id="todayAdvice"><div class="star">☆</div><div><strong></strong><p></p></div><div class="chevron">›</div></article>
      </section>

      <section class="page" data-page="trends"><div class="kpi-row" id="trendKpis"></div><div class="grid detail-grid"><article class="card wide"><div class="svg-wrap">{{TREND_SVG}}</div></article><article class="card"><h3 id="baselineTitle"></h3><div id="baselineDetails"></div></article><article class="card"><h3 id="comparisonTitle"></h3><div id="comparisonDetails"></div></article></div></section>
      <section class="page" data-page="time"><div class="kpi-row" id="timeKpis"></div><div class="grid detail-grid"><article class="card wide"><div class="svg-wrap">{{CATEGORY_SVG}}</div></article><article class="card wide"><div class="svg-wrap">{{LEVEL_SVG}}</div></article><article class="card wide"><div class="svg-wrap">{{HOURLY_SVG}}</div></article></div></section>
      <section class="page" data-page="apps"><article class="card"><div class="card-head"><h3 id="allAppsTitle"></h3></div><table class="table"><thead><tr id="appHeaders"></tr></thead><tbody id="allApps"></tbody></table></article></section>
      <section class="page" data-page="websites"><article class="card"><div class="card-head"><h3 id="allSitesTitle"></h3></div><table class="table"><thead><tr id="siteHeaders"></tr></thead><tbody id="allSites"></tbody></table><p class="section-note" id="browserNote"></p></article></section>
      <section class="page" data-page="deep"><div class="kpi-row" id="deepKpis"></div><div class="grid detail-grid"><article class="card wide"><h3 id="deepHoursTitle"></h3><div class="heatmap" id="deepHours"></div><p class="section-note" id="deepDefinition"></p></article></div></section>
      <section class="page" data-page="ai"><div class="kpi-row" id="aiKpis"></div><article class="card"><h3 id="allInsightsTitle"></h3><div class="insight-list" id="allInsights"></div></article></section>
      <section class="page" data-page="rules"><div class="kpi-row" id="ruleKpis"></div><div class="grid detail-grid"><article class="card"><h3 id="ruleIssuesTitle"></h3><table class="table"><tbody id="ruleIssues"></tbody></table></article><article class="card"><h3 id="ruleSuggestionsTitle"></h3><table class="table"><tbody id="ruleSuggestions"></tbody></table></article></div></section>
      <section class="page" data-page="settings"><div class="grid detail-grid"><article class="card"><h3 id="reportSettingsTitle"></h3><table class="table"><tbody id="reportSettings"></tbody></table></article><article class="card"><h3 id="privacyTitle"></h3><div class="privacy-note" id="privacyDetails"></div></article></div></section>
      <div class="footer" id="footer"></div>
    </main>
  </div>
  <script>
    const REPORT={{REPORT_JSON}};
    const zh=REPORT.locale==='zh-CN';
    const tr=(z,e)=>zh?z:e;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const duration=s=>{s=Math.max(0,Math.round(Number(s)||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return zh?(h?(m?`${h}小时${m}分`:`${h}小时`):`${m}分钟`):(h?(m?`${h}h ${m}m`:`${h}h`):`${m}m`)};
    const signed=v=>v==null?'—':`${v>0?'+':''}${Number(v).toFixed(1)}%`;
    const colors=['#3bd16f','#4488ff','#8b5cf6','#36c5d0','#f5b51b','#f05d4f','#94a3b8','#ec4899'];
    const navItems=[['overview','▦',tr('概览','Overview')],['trends','⌁',tr('趋势分析','Trends')],['time','◫',tr('时间分布','Time')],['apps','▣',tr('应用分析','Apps')],['websites','◎',tr('网站分析','Websites')],['deep','◉',tr('深度工作','Deep work')],['ai','✣',tr('AI 洞察','AI insights')],['rules','⚙',tr('规则健康','Rule health')],['settings','✥',tr('报告设置','Settings')]];
    const $=id=>document.getElementById(id);
    document.getElementById('nav').innerHTML=navItems.map(([id,icon,label],i)=>`<button data-page-target="${id}" class="${i===0?'active':''}"><span class="nav-icon">${icon}</span>${esc(label)}</button>`).join('');
    function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===id));document.querySelectorAll('[data-page-target]').forEach(x=>x.classList.toggle('active',x.dataset.pageTarget===id));const item=navItems.find(x=>x[0]===id);$('pageTitle').textContent=item?item[2]:'';window.scrollTo({top:0,behavior:'smooth'})}
    document.addEventListener('click',e=>{const p=e.target.closest('[data-page-target]');if(p)showPage(p.dataset.pageTarget);const g=e.target.closest('[data-goto]');if(g)showPage(g.dataset.goto)});
    $('themeToggle').onclick=()=>document.body.classList.toggle('light');
    const S=REPORT.summary,C=REPORT.comparison,B=REPORT.baseline,R=REPORT.rule_health;
    $('periodLabel').textContent='▣  '+REPORT.period.label;
    $('calibrationBadge').textContent=S.score_status==='calibrated'?tr('已校准','Calibrated'):tr('估算评分','Estimated');
    $('scoreTitle').textContent=tr('效率评分','Productivity pulse');$('timeOverviewTitle').textContent=tr('时间概览','Time overview');
    $('pulse').textContent=Math.round(S.pulse);$('scoreRing').style.setProperty('--score',S.pulse);$('scoreLabel').textContent=S.pulse>=80?tr('优秀','Excellent'):S.pulse>=65?tr('良好','Good'):S.pulse>=50?tr('平稳','Balanced'):tr('需要关注','Needs attention');
    $('scoreNote').textContent=B.sufficient?tr(`比个人可比日期基线${S.pulse-(B.pulse||0)>=0?'高':'低'} ${Math.abs(S.pulse-(B.pulse||0)).toFixed(1)} 分`,` ${Math.abs(S.pulse-(B.pulse||0)).toFixed(1)} points ${S.pulse-(B.pulse||0)>=0?'above':'below'} your comparable-day baseline`):tr('正在积累个人基线，不提供群体排名','Building your personal baseline; no population ranking');
    $('scoreStatus').textContent=S.score_status==='calibrated'?tr('生产力映射已确认','Mappings confirmed'):tr(`已确认映射 ${S.confirmed_mapping_percent.toFixed(1)}%`,`Confirmed mapping ${S.confirmed_mapping_percent.toFixed(1)}%`);
    const metricData=[
      [tr('总活跃时间','Active time'),S.active_seconds,'#8b5cf6',C.active_percent_change],
      [tr('生产性时间','Productive time'),S.productive_seconds,'#34d399',C.productive_percent_change,`${S.productive_percent.toFixed(1)}%`],
      [tr('个人/干扰时间','Personal / distracting'),S.levels.filter(x=>['personal','distracting'].includes(x.level)).reduce((a,x)=>a+x.seconds,0),'#f59e0b',null],
      [tr('深度工作时间','Deep work'),S.deep_work.seconds,'#3b82f6',C.deep_work_percent_change]
    ];
    $('metrics').innerHTML=metricData.map(([label,sec,color,change,extra])=>`<div class="metric"><div class="metric-label"><i style="background:${color}"></i>${esc(label)}</div><strong>${duration(sec)}</strong><div class="metric-sub">${extra||''}</div><span class="delta ${change==null?'neutral':change>=0?'positive':'negative'}">${change==null?tr('暂无可比数据','No comparison'):tr('较上一周期 ','vs previous ')+signed(change)}</span></div>`).join('');
    $('distributionTitle').textContent=tr('时间分布','Time distribution');$('trendTitle').textContent=tr('效率趋势','Productivity trend');$('appRankTitle').textContent=tr('应用使用排行','Application ranking');$('siteRankTitle').textContent=tr('网站访问排行','Website ranking');$('insightTitle').textContent=tr('AI 洞察','AI insights');
    document.querySelectorAll('.link-button:not([data-goto="trends"])').forEach(b=>b.textContent=tr('查看全部','View all'));
    const cats=S.categories.slice(0,7);let cursor=0,segments=[];cats.forEach((x,i)=>{segments.push(`${colors[i%colors.length]} ${cursor}% ${cursor+x.percent}%`);cursor+=x.percent});if(cursor<100)segments.push(`#273142 ${cursor}% 100%`);$('donut').style.background=`conic-gradient(${segments.join(',')})`;$('donutTotal').textContent=duration(S.active_seconds);$('donutCaption').textContent=tr('活跃总计','active total');
    $('categoryLegend').innerHTML=cats.map((x,i)=>`<div class="legend-row"><span class="legend-dot" style="background:${colors[i%colors.length]}"></span><span>${esc(x.path.split(' / ').pop())}</span><strong>${duration(x.seconds)}</strong><em>${x.percent.toFixed(1)}%</em></div>`).join('');
    function ranks(items,key,limit=5){const max=Math.max(...items.map(x=>x.seconds),1);return items.slice(0,limit).map((x,i)=>`<div class="rank-row"><span class="rank">${i+1}</span><span class="app-icon">${esc(String(x[key]||'?').slice(0,1).toUpperCase())}</span><span>${esc(x[key])}</span><span class="rank-bar"><span style="width:${100*x.seconds/max}%"></span></span><span class="rank-time">${duration(x.seconds)}</span></div>`).join('')||`<div class="empty">${tr('暂无数据','No data')}</div>`}
    $('appRank').innerHTML=ranks(S.apps,'app');$('siteRank').innerHTML=ranks(S.domains,'domain');
    function insightHtml(x){const icon=x.kind==='focus'?'◎':x.kind==='ai'?'↗':x.kind==='rules'?'⚙':'i';return `<div class="insight ${esc(x.severity)}"><div class="insight-icon">${icon}</div><div><h4>${esc(x.title)}</h4><p>${esc(x.evidence)} ${esc(x.action)}</p></div></div>`}
    $('insightList').innerHTML=REPORT.insights.map(insightHtml).join('');$('allInsights').innerHTML=REPORT.insights.map(insightHtml).join('');$('allInsightsTitle').textContent=tr('完整洞察与行动建议','Insights and actions');
    const primary=REPORT.insights[0];$('todayAdvice').querySelector('strong').textContent=tr('今日建议','Today’s action');$('todayAdvice').querySelector('p').textContent=primary.action;
    function kpis(data){return data.map(([label,value])=>`<div class="kpi"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('')}
    $('timeKpis').innerHTML=kpis([[tr('活跃时间','Active time'),duration(S.active_seconds)],[tr('离开时间','AFK time'),REPORT.source.afk_available?duration(S.afk_seconds):'—'],[tr('分类覆盖率','Category coverage'),`${S.category_coverage_percent.toFixed(1)}%`],[tr('效率映射覆盖','Productivity mapping'),`${S.mapped_percent.toFixed(1)}%`]]);
    $('trendKpis').innerHTML=kpis([[tr('当前效率分','Current pulse'),S.pulse.toFixed(1)],[tr('基线样本','Baseline samples'),B.sample_count],[tr('较上一周期','vs previous'),C.pulse_change==null?'—':`${C.pulse_change>0?'+':''}${C.pulse_change.toFixed(1)}`],[tr('数据天数','Days included'),REPORT.trend.filter(x=>x.active_seconds>0).length]]);
    $('baselineTitle').textContent=tr('个人基线','Personal baseline');$('comparisonTitle').textContent=tr('周期对比','Period comparison');
    $('baselineDetails').innerHTML=B.sufficient?`<table class="table"><tr><td>${tr('效率分','Pulse')}</td><td>${B.pulse.toFixed(1)}</td></tr><tr><td>${tr('活跃时间','Active')}</td><td>${duration(B.active_seconds)}</td></tr><tr><td>${tr('深度工作','Deep work')}</td><td>${duration(B.deep_work_seconds)}</td></tr></table>`:`<div class="empty">${tr('至少需要3个可比样本','At least 3 comparable samples are required')}</div>`;
    $('comparisonDetails').innerHTML=`<table class="table"><tr><td>${tr('效率分变化','Pulse change')}</td><td>${C.pulse_change==null?'—':C.pulse_change.toFixed(1)}</td></tr><tr><td>${tr('活跃时间变化','Active change')}</td><td>${signed(C.active_percent_change)}</td></tr><tr><td>${tr('深度工作变化','Deep work change')}</td><td>${signed(C.deep_work_percent_change)}</td></tr></table>`;
    $('allAppsTitle').textContent=tr('全部应用','All applications');$('allSitesTitle').textContent=tr('全部网站域名','All website domains');$('appHeaders').innerHTML=`<th>#</th><th>${tr('应用','Application')}</th><th>${tr('占比','Share')}</th><th>${tr('时长','Time')}</th>`;$('siteHeaders').innerHTML=`<th>#</th><th>${tr('域名','Domain')}</th><th>${tr('占比','Share')}</th><th>${tr('时长','Time')}</th>`;
    $('allApps').innerHTML=S.apps.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.app)}</td><td>${x.percent.toFixed(1)}%</td><td>${duration(x.seconds)}</td></tr>`).join('');$('allSites').innerHTML=S.domains.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.domain)}</td><td>${x.percent.toFixed(1)}%</td><td>${duration(x.seconds)}</td></tr>`).join('');
    $('browserNote').textContent=REPORT.source.browser_available?tr('仅展示域名；完整 URL 未写入报告。','Domains only; full URLs were not written to the report.'):tr('未发现浏览器 watcher，网站分析不可用。','No browser watcher was found; website analysis is unavailable.');
    $('deepKpis').innerHTML=kpis([[tr('深度工作总时长','Total deep work'),duration(S.deep_work.seconds)],[tr('最长专注块','Longest block'),duration(S.deep_work.longest_seconds)],[tr('专注块数量','Block count'),S.deep_work.block_count],[tr('生产性时间占比','Productive share'),`${S.productive_percent.toFixed(1)}%`]]);$('deepHoursTitle').textContent=tr('专注块开始时段','Focus-block start hours');$('deepDefinition').textContent=tr('默认将至少25分钟、间隔不超过2分钟的专注工作事件合并为深度工作块。','Focus events lasting at least 25 minutes, with gaps no longer than 2 minutes, form deep-work blocks.');
    const maxDeep=Math.max(...S.deep_work.start_hours,1);$('deepHours').innerHTML=S.deep_work.start_hours.map((v,h)=>`<div class="heatbar" style="height:${Math.max(3,110*v/maxDeep)}px;opacity:${.25+.75*v/maxDeep}" data-tip="${h}:00 · ${v}"></div>`).join('');
    $('aiKpis').innerHTML=kpis([[tr('AI相关时间','AI-related time'),duration(S.ai_seconds)],[tr('较个人基线','vs baseline'),B.sufficient&&B.ai_seconds!=null?signed(100*(S.ai_seconds-B.ai_seconds)/(B.ai_seconds||1)):'—'],[tr('AI域名数','AI domains'),S.domains.filter(x=>/chatgpt|openai|claude|gemini|copilot|perplexity|deepseek/i.test(x.domain)).length],[tr('建议数量','Recommendations'),REPORT.insights.filter(x=>x.kind==='ai').length]]);
    $('ruleKpis').innerHTML=kpis([[tr('分类覆盖率','Category coverage'),`${R.coverage_percent.toFixed(1)}%`],[tr('有效规则','Valid rules'),R.rule_count],[tr('规则问题','Rule issues'),R.issue_count],[tr('冲突时间','Conflict time'),duration(R.conflict_seconds)]]);$('ruleIssuesTitle').textContent=tr('规则问题','Rule issues');$('ruleSuggestionsTitle').textContent=tr('优化候选','Optimization candidates');
    $('ruleIssues').innerHTML=R.issues.map(x=>`<tr><td><span class="pill warn">${esc(x.issue)}</span></td><td>${esc(x.category)}</td></tr>`).join('')||`<tr><td>${tr('没有检测到结构性问题','No structural issues detected')}</td><td><span class="pill ok">OK</span></td></tr>`;$('ruleSuggestions').innerHTML=R.suggestions.map(x=>`<tr><td>${esc(x.value)}</td><td><code>${esc(x.suggested_regex)}</code><br><span class="section-note">${duration(x.expected_seconds)}</span></td></tr>`).join('')||`<tr><td>${tr('暂无候选','No candidates')}</td><td></td></tr>`;
    $('reportSettingsTitle').textContent=tr('报告配置','Report configuration');$('privacyTitle').textContent=tr('隐私边界','Privacy boundary');$('reportSettings').innerHTML=`<tr><td>${tr('数据源','Source')}</td><td>${esc(REPORT.source.mode)}</td></tr><tr><td>${tr('主机','Host')}</td><td>${esc(REPORT.source.host||'—')}</td></tr><tr><td>${tr('一天开始','Start of day')}</td><td>${esc(REPORT.settings.start_of_day)}</td></tr><tr><td>${tr('一周开始','Start of week')}</td><td>${esc(REPORT.settings.start_of_week)}</td></tr><tr><td>${tr('类别数量','Categories')}</td><td>${REPORT.settings.category_count}</td></tr><tr><td>${tr('生产力映射','Productivity mappings')}</td><td>${REPORT.profile_status.confirmed_count}/${REPORT.profile_status.mapping_count} ${tr('已确认','confirmed')}</td></tr>`;
    $('privacyDetails').innerHTML=tr('原始窗口标题、完整 URL、文档名、聊天或邮件主题和原始事件均未写入报告。网站只保留聚合域名。','Raw window titles, full URLs, document names, chat or email subjects, and raw events were not written to the report. Websites are domain-only aggregates.');
    $('sourceCard').innerHTML=`<h4>${tr('数据状态','Data status')}</h4><p>${tr('数据源','Source')}：${esc(REPORT.source.mode)}</p><p>${tr('最后事件','Last event')}：${esc(REPORT.source.last_event_at||'—')}</p><p>${tr('分类覆盖率','Coverage')}：${S.category_coverage_percent.toFixed(1)}%</p><p class="source-ok">✓ ${tr('本地分析完成','Local analysis complete')}</p>`;
    $('footer').textContent=`ActivityWatch Analytics · ${REPORT.generated_at} · ${tr('离线、自包含、隐私聚合','Offline, self-contained, privacy-preserving')}`;
  </script>
</body>
</html>
